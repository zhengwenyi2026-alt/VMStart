name: VMStart
options:
  bundleIdPrefix: com.vmstart
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: VMStart
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
    INFOPLIST_FILE: VMStart/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VMStart/Resources/VMStart.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.vmstart.app
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/../Frameworks"
    SWIFT_OBJC_BRIDGING_HEADER: VMStart/Bridging/VMStart-Bridging-Header.h

targets:
  VMStart:
    type: application
    platform: macOS
    sources:
      - path: VMStart/Sources
      - path: VMStart/Assets.xcassets
      - path: VMStart/Resources/en.lproj
        buildPhase: resources
        type: folder
      - path: VMStart/Resources/zh-Hans.lproj
        buildPhase: resources
        type: folder
      - path: VMStart/Resources/Licenses
        buildPhase: resources
        type: folder
      - path: VMStart/Resources/BuiltInBrowsers
        buildPhase: resources
        type: folder
      - path: VMStart/Resources/CLI
        buildPhase: resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: VMStart/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VMStart/Resources/VMStart.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: VMStart/Bridging/VMStart-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.vmstart.app
    info:
      path: VMStart/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.vmstart.command
            CFBundleURLSchemes:
              - vmstart
    entitlements:
      path: VMStart/Resources/VMStart.entitlements
