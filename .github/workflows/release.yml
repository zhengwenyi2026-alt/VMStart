name: Build and Release VMStart

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name || '1.0.0' }}

jobs:
  # ═══════════════════════════════════════════════════
  # macOS Apple Silicon (arm64) DMG
  # ═══════════════════════════════════════════════════
  build-macos-arm64:
    name: "macOS DMG (Apple Silicon arm64)"
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install QEMU
        run: brew install qemu

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build VMStart (arm64)
        run: |
          xcodebuild -project VMStart.xcodeproj \
            -scheme VMStart \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            clean build

      - name: Package DMG (arm64)
        run: |
          mkdir -p dmg/apple_silicon
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "VMStart.app" -maxdepth 1 | head -1)
          DMG_TEMP=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_TEMP/"
          
          # Copy QEMU arm64 binaries
          ENGINES_DIR="$DMG_TEMP/VMStart.app/Contents/MacOS/engines"
          mkdir -p "$ENGINES_DIR"
          cp /opt/homebrew/bin/qemu-system-* "$ENGINES_DIR/" 2>/dev/null || true
          cp /opt/homebrew/bin/qemu-img "$ENGINES_DIR/" 2>/dev/null || true
          chmod +x "$ENGINES_DIR/"* 2>/dev/null || true
          
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname "VMStart" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "dmg/apple_silicon/VMStart-${{ env.VERSION }}-arm64.dmg"
          rm -rf "$DMG_TEMP"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-macOS-arm64
          path: dmg/apple_silicon/VMStart-*-arm64.dmg
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # macOS Intel (x86_64) DMG
  # ═══════════════════════════════════════════════════
  build-macos-x86_64:
    name: "macOS DMG (Intel x86_64)"
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install QEMU
        run: brew install qemu

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build VMStart (x86_64)
        run: |
          xcodebuild -project VMStart.xcodeproj \
            -scheme VMStart \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=x86_64 \
            clean build

      - name: Package DMG (x86_64)
        run: |
          mkdir -p dmg/x86_64
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "VMStart.app" -maxdepth 1 | head -1)
          DMG_TEMP=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_TEMP/"
          
          # Copy QEMU x86_64 binaries
          ENGINES_DIR="$DMG_TEMP/VMStart.app/Contents/MacOS/engines"
          mkdir -p "$ENGINES_DIR"
          cp /usr/local/bin/qemu-system-* "$ENGINES_DIR/" 2>/dev/null || true
          cp /usr/local/bin/qemu-img "$ENGINES_DIR/" 2>/dev/null || true
          chmod +x "$ENGINES_DIR/"* 2>/dev/null || true
          
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname "VMStart" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "dmg/x86_64/VMStart-${{ env.VERSION }}-x86_64.dmg"
          rm -rf "$DMG_TEMP"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-macOS-x86_64
          path: dmg/x86_64/VMStart-*-x86_64.dmg
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # Windows x86_64 EXE (Docker)
  # ═══════════════════════════════════════════════════
  build-windows-x86_64:
    name: "Windows EXE (x86_64)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows x64 EXE
        shell: pwsh
        run: |
          cd VMStart-Windows/VMStart
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o ../../publish-x64

      - name: Rename EXE
        shell: pwsh
        run: |
          mkdir -p exe/x86_64
          Copy-Item publish-x64/VMStart.exe exe/x86_64/VMStart-${{ env.VERSION }}-x86_64.exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-Windows-x86_64
          path: exe/x86_64/VMStart-*-x86_64.exe
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # Windows ARM64 EXE (Docker)
  # ═══════════════════════════════════════════════════
  build-windows-arm64:
    name: "Windows EXE (ARM64)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows ARM64 EXE
        shell: pwsh
        run: |
          cd VMStart-Windows/VMStart
          dotnet publish -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o ../../publish-arm64

      - name: Rename EXE
        shell: pwsh
        run: |
          mkdir -p exe/arm64
          Copy-Item publish-arm64/VMStart.exe exe/arm64/VMStart-${{ env.VERSION }}-arm64.exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-Windows-arm64
          path: exe/arm64/VMStart-*-arm64.exe
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # Release (only on tags)
  # ═══════════════════════════════════════════════════
  release:
    name: "Create Release"
    needs: [build-macos-arm64, build-macos-x86_64, build-windows-x86_64, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          name: "VMStart ${{ github.ref_name }}"
          body: |
            ## VMStart ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS (Apple Silicon) | arm64 | VMStart-${{ github.ref_name }}-arm64.dmg |
            | macOS (Intel) | x86_64 | VMStart-${{ github.ref_name }}-x86_64.dmg |
            | Windows | x86_64 | VMStart-${{ github.ref_name }}-x86_64.exe |
            | Windows | arm64 | VMStart-${{ github.ref_name }}-arm64.exe |
            
            ### Features
            - 15 emulation engines (QEMU + retro consoles)
            - 33 CPU architectures supported
            - Chromium browser for ISO downloads
            - Log viewer & printer support
            - All 15 engines GPLv2
            
            ### Requirements
            - macOS 14.0+ (Apple Silicon or Intel)
            - Windows 10/11 (64-bit)
            
            ### License
            GPLv2 or later (compatible with GPLv3 components)
          draft: false
          prerelease: false
